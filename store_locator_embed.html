<style>
.section_store-locator [hidden]{display:none !important}
.section_store-locator .filter-modal.is-open{display:flex}
.store-locator_reset.is-visible{display:block}
/* is-active is set by the script (selected store); hover lives on the Webflow class anfahrt_store is-card */
.store-locator_list .anfahrt_store.is-card.is-active{border-color:#ffe300;background-color:#f2f2f2}
/* the store name is the focusable control; the focus ring is drawn around the whole card */
@supports selector(:has(*)){
.store-locator_list .anfahrt_store.is-card:has([data-store-name]:focus-visible){outline:2px solid #224385;outline-offset:2px}
.store-locator_list [data-store-name]:focus-visible{outline:none}
}
.store-locator_popup{z-index:3} /* above the zoom buttons, so the close button is never covered */
.store-locator_popup .mapboxgl-popup-content{min-width:15rem;padding:0;border-radius:.5rem;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.store-locator_popup .mapboxgl-popup-tip{border-width:6px}
.store-locator_popup .anfahrt_store{position:relative;display:flex;flex-direction:column;align-items:flex-start;row-gap:.75rem;padding:.75rem;background-color:#fff;border:0;border-radius:inherit;cursor:default;max-height:inherit;overflow-y:auto;overscroll-behavior:contain} /* scrolls inside, close button stays */
.store-locator_popup .anfahrt_store-logo{width:2.875rem;height:2.875rem;object-fit:contain}
.store-locator_popup .anfahrt_store-content{display:flex;flex-direction:column;row-gap:.25rem}
.store-locator_popup .anfahrt_store-content>*{margin:0}
.store-locator_popup .anfahrt_store-title{margin-bottom:.5rem;padding-right:1.5rem;color:#224385;font-size:1rem;font-weight:600;line-height:1.5}
.store-locator_popup .anfahrt_store-logo+.anfahrt_store-content .anfahrt_store-title{padding-right:0}
.store-locator_popup .text-size-small{color:#454545;font-size:.875rem;line-height:1.5}
.store-locator_popup .button.is-link{margin-top:.25rem;padding:0;color:#224385}
.store-locator_popup .button.is-link .text-size-small{color:inherit}
.store-locator_popup .mapboxgl-popup-close-button{top:1.5rem;right:.75rem;width:1rem;height:1rem;padding:0;font-size:1.25rem;line-height:1rem;color:#224385;transform:translateY(-50%)}
.store-locator_popup .mapboxgl-popup-close-button:hover{background-color:transparent;opacity:.7}
.store-locator_popup .mapboxgl-popup-close-button:focus-visible{outline:2px solid #224385;outline-offset:2px}
.store-locator_popup .mapboxgl-popup-content:has(.anfahrt_store-logo) .mapboxgl-popup-close-button{top:2.1875rem}
.store-locator_map.mapboxgl-map{position:absolute;inset:0;width:100%;height:100%}
.store-locator_map .mapboxgl-ctrl-group{border-radius:.5rem}
</style>

<script>
/* Händler finden: Mapbox store locator.
   Settings on [data-store-locator]: data-mapbox-token (public pk. token), data-mapbox-tileset, data-mapbox-style, data-factory-lnglat ("lng,lat").
   Stores come from the Mapbox tileset (CSV columns: id, name, chain, strasse, hausnummer, plz, ort, telefon, latitude, longitude).
   "chain" must match the slug of a Händler CMS item — its logo is shown in the popup and the list. */
(function(){
  var root = document.querySelector('[data-store-locator]');
  if (!root || root.hasAttribute('data-store-init')) return;
  root.setAttribute('data-store-init', '');

  var warn = function(text){ if (window.console) console.warn('[Händler finden] ' + text); };

  var TOKEN = (root.getAttribute('data-mapbox-token') || '').trim();
  var TILESET = (root.getAttribute('data-mapbox-tileset') || '').trim();
  var STYLE = root.getAttribute('data-mapbox-style') || 'mapbox://styles/mapbox/light-v11';
  var GL_URL = 'https://api.mapbox.com/mapbox-gl-js/v3.9.4/';
  var START = { center: [10.45, 51.1], zoom: 5 };
  var LIST_LIMIT = 50; /* Tilequery maximum */
  var RADIUS_NEAR = 50000, RADIUS_FAR = 200000;

  var MSG = {
    loadError: 'Die Karte konnte nicht geladen werden. Bitte später erneut versuchen.',
    searchError: 'Die Suche ist gerade nicht möglich. Bitte später erneut versuchen.',
    notFound: 'Diese PLZ oder dieser Ort wurde nicht gefunden.',
    empty: 'Bitte PLZ oder Ort eingeben.',
    searching: 'Märkte werden gesucht …',
    none: 'In der Nähe wurden keine Märkte gefunden.',
    config: 'Karte nicht konfiguriert.'
  };

  var q = function(selector, scope){ return (scope || root).querySelector(selector); };
  var forEach = function(nodes, fn){ Array.prototype.forEach.call(nodes, fn); };
  var mapEl = q('[data-store-map]');
  var input = q('[data-store-search]');
  var submit = q('[data-store-submit]');
  var reset = q('[data-store-reset]');
  var listOpen = q('[data-store-list-open]');
  var message = q('[data-store-message]');
  var modal = q('[data-store-modal]');
  var listEl = q('[data-store-list]');
  var template = q('[data-store-templates] [data-store-card]');
  var factoryCard = q('[data-store-factory]');
  if (!mapEl || !template) return;

  var say = function(text){ if (message) message.textContent = text || ''; };
  /* Search results and map errors share one message line: a map error is appended, never replaces results */
  var resultText = '', mapBroken = false, activeQuery = '';
  var showStatus = function(){ say(mapBroken ? (resultText ? resultText + ' ' : '') + MSG.loadError : resultText); };
  var mapError = function(){ mapBroken = true; showStatus(); };
  var mapRecovered = function(){
    if (!mapBroken) return;
    mapBroken = false;
    if (!activeQuery) showStatus(); /* a running search updates the line itself */
  };
  say('');

  if (!TOKEN || !TILESET) { say(MSG.config); warn('data-mapbox-token / data-mapbox-tileset fehlen'); return; }
  /* Only public tokens may ever reach the browser */
  if (TOKEN.indexOf('pk.') !== 0) { say(MSG.config); warn('data-mapbox-token muss ein öffentlicher Token (pk.) sein'); return; }
  if (!/^[\w.-]+$/.test(TILESET)) { say(MSG.config); warn('data-mapbox-tileset ist ungültig'); return; }

  /* ---------- Data helpers ---------- */

  var toLngLat = function(lng, lat){
    lng = Number(lng); lat = Number(lat);
    if (!isFinite(lng) || !isFinite(lat) || lng < -180 || lng > 180 || lat < -90 || lat > 90) return null;
    return [lng, lat];
  };
  var text = function(v){ return v == null ? '' : String(v).trim(); };

  var FACTORY = (function(){
    var parts = (root.getAttribute('data-factory-lnglat') || '').split(',');
    return parts.length === 2 ? toLngLat(parts[0], parts[1]) : null;
  })();

  var safeUrl = function(src){
    try {
      var url = new URL(src, window.location.href);
      return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : '';
    } catch (e) { return ''; }
  };

  /* Chain logos from the Händler CMS list, keyed by lower-case slug */
  var chains = new Map();
  forEach(root.querySelectorAll('[data-chain]'), function(el){
    var slugEl = q('[data-chain-slug]', el);
    var img = q('img', el);
    var slug = slugEl ? text(slugEl.textContent).toLowerCase() : '';
    if (!slug || chains.has(slug)) return;
    var src = img && !img.classList.contains('w-dyn-bind-empty') ? safeUrl(img.currentSrc || img.getAttribute('src') || '') : '';
    chains.set(slug, src ? { src: src, alt: img.getAttribute('alt') || '' } : null);
  });

  var toStore = function(feature){
    if (!feature || !feature.geometry || !Array.isArray(feature.geometry.coordinates)) return null;
    var lngLat = toLngLat(feature.geometry.coordinates[0], feature.geometry.coordinates[1]);
    if (!lngLat) return null;
    var p = feature.properties || {};
    var plz = text(p.plz);
    if (/^\d{4}$/.test(plz)) plz = '0' + plz; /* CSV import turns 01067 into 1067 */
    return {
      name: text(p.name),
      chain: text(p.chain).toLowerCase(),
      street: [text(p.strasse), text(p.hausnummer)].filter(Boolean).join(' '),
      city: [plz, text(p.ort)].filter(Boolean).join(' '),
      phone: text(p.telefon),
      lngLat: lngLat
    };
  };

  /* Cloned Webflow templates must not duplicate HTML ids; references to the removed ids are dropped too */
  var ID_REFS = ['aria-labelledby', 'aria-describedby', 'aria-controls', 'aria-owns', 'for'];
  var stripIds = function(node){
    var removed = new Set();
    [node].concat(Array.prototype.slice.call(node.querySelectorAll('[id]'))).forEach(function(el){
      if (el.id) { removed.add(el.id); el.removeAttribute('id'); }
    });
    if (!removed.size) return node;
    [node].concat(Array.prototype.slice.call(node.querySelectorAll('*'))).forEach(function(el){
      ID_REFS.forEach(function(attr){
        var value = el.getAttribute(attr);
        if (!value) return;
        var kept = value.split(/\s+/).filter(function(id){ return id && !removed.has(id); });
        if (kept.length) el.setAttribute(attr, kept.join(' ')); else el.removeAttribute(attr);
      });
    });
    return node;
  };

  var fillCard = function(card, store){
    var set = function(selector, value){
      var el = q(selector, card);
      if (!el) return;
      if (value) el.textContent = value; else el.remove();
    };
    var label = store.name || store.street || store.city; /* the name doubles as the select button */
    set('[data-store-name]', label);
    set('[data-store-street]', store.street === label ? '' : store.street);
    set('[data-store-city]', store.city === label ? '' : store.city);
    set('[data-store-phone]', store.phone);
    var logo = q('[data-store-logo]', card);
    var chain = chains.get(store.chain);
    if (logo) {
      if (chain) { logo.src = chain.src; logo.alt = chain.alt; } else logo.remove();
    }
    var route = q('[data-store-route]', card);
    if (route) route.href = 'https://www.google.com/maps/dir/?api=1&destination=' + store.lngLat[1] + ',' + store.lngLat[0];
    return card;
  };

  var makeCard = function(store){ return fillCard(stripIds(template.cloneNode(true)), store); };

  /* ---------- Marker image ---------- */

  /* Yellow pin with the Burgis tower (24x24 SVG path), drawn once at 2x for sharp rendering */
  var TOWER_PATH = 'M21.2596 2.68038C21.9777 2.7088 22.7136 2.70644 23.4335 2.71214C23.4829 3.81021 23.4498 5.11818 23.4488 6.23161L23.4445 14.5409C21.9103 14.0807 21.0973 13.981 19.5012 14.2818C15.6895 15 12.731 17.0868 10.5679 20.2597C7.88385 18.542 5.17746 17.4862 1.95889 18.0044C1.53807 18.0722 1.10343 18.126 0.680176 18.1883V2.68018C1.26385 2.72131 2.23013 2.70408 2.84173 2.71026C2.85868 3.24766 2.59988 4.93073 3.75257 4.37381C4.08015 4.05102 3.95627 3.23689 3.96239 2.69609L5.98818 2.71061C6.00118 3.04236 5.89078 4.14856 6.18251 4.31558C7.37806 4.99986 7.12392 3.28448 7.12656 2.70797C7.87864 2.68775 8.66685 2.70422 9.42179 2.70873C9.46521 5.21114 9.40998 7.77121 9.43645 10.2874L14.6468 10.2938C14.752 7.81352 14.6467 5.20217 14.7016 2.70067L16.9432 2.70283C16.9496 3.28698 16.7731 3.9293 17.1167 4.34511C17.4871 4.58057 18.0099 4.46211 18.0581 4.02795C18.1005 3.64625 18.0636 3.07842 18.0582 2.6899L20.1202 2.70706C20.1392 3.26684 19.9658 3.94034 20.2899 4.33851C20.5274 4.49893 20.9314 4.51998 21.111 4.29189C21.3696 3.96355 21.2643 3.09203 21.2596 2.68038Z';
  var pinImage = function(){
    var size = 68, r = 16, canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffe300';
    ctx.beginPath();
    ctx.moveTo(r, 0); ctx.arcTo(size, 0, size, size, r); ctx.arcTo(size, size, 0, size, r);
    ctx.arcTo(0, size, 0, 0, r); ctx.arcTo(0, 0, size, 0, r); ctx.closePath(); ctx.fill();
    if (typeof Path2D !== 'undefined') { /* without Path2D the pin stays a plain yellow square */
      var scale = 1.75; /* 24px icon -> 42px inside the 68px pin, centred on the tower shape */
      ctx.translate((size - 24 * scale) / 2, size / 2 - 11.47 * scale);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#0B4887';
      ctx.fill(new Path2D(TOWER_PATH));
    }
    return ctx.getImageData(0, 0, size, size);
  };

  /* ---------- Requests ---------- */

  /* Errors carry a kind, never the request URL (it contains the token) */
  var fail = function(kind, detail){ var err = new Error(kind); err.kind = kind; err.detail = detail; return err; };
  var isAbort = function(err){ return err && (err.name === 'AbortError' || err.kind === 'aborted'); };

  var getJson = function(url, name, signal){
    return fetch(url, { signal: signal })
      .catch(function(err){ throw isAbort(err) ? err : fail('network', name); })
      .then(function(res){
        if (!res.ok) throw fail('http', name + ' HTTP ' + res.status);
        return res.json().catch(function(){ throw fail('invalid', name + ': keine gültige JSON-Antwort'); });
      });
  };

  var reportError = function(err, context){
    if (isAbort(err)) return;
    warn(context + ': ' + ((err && err.detail) || (err && err.message) || 'unbekannter Fehler'));
  };

  /* ---------- Mapbox library + map lifecycle ---------- */

  var libraryPromise = null, mapPromise = null;
  var map = null, popup = null, searchMarker = null;

  /* One shared promise: repeated calls reuse it; after a failure the next call retries */
  var loadLibrary = function(){
    if (window.mapboxgl) return Promise.resolve(window.mapboxgl);
    if (libraryPromise) return libraryPromise;
    libraryPromise = new Promise(function(resolve, reject){
      if (!document.querySelector('link[data-mapbox-css]')) {
        var css = document.createElement('link');
        css.rel = 'stylesheet'; css.href = GL_URL + 'mapbox-gl.css'; css.setAttribute('data-mapbox-css', '');
        document.head.appendChild(css);
      }
      var old = document.querySelector('script[data-mapbox-js]');
      if (old) old.remove();
      var js = document.createElement('script');
      js.src = GL_URL + 'mapbox-gl.js';
      js.async = true;
      js.setAttribute('data-mapbox-js', '');
      js.onload = function(){ window.mapboxgl ? resolve(window.mapboxgl) : reject(fail('library', 'mapboxgl fehlt nach dem Laden')); };
      js.onerror = function(){ reject(fail('library', 'mapbox-gl.js konnte nicht geladen werden')); };
      document.head.appendChild(js);
    }).catch(function(err){
      libraryPromise = null; /* allow a controlled retry */
      throw err;
    });
    return libraryPromise;
  };

  var pointer = function(instance, layer){
    instance.on('mouseenter', layer, function(){ instance.getCanvas().style.cursor = 'pointer'; });
    instance.on('mouseleave', layer, function(){ instance.getCanvas().style.cursor = ''; });
  };

  /* Popups must stay inside the map: their size is capped to the map, and the map pans until the whole card is visible */
  var POPUP_GAP = 12;      /* minimum distance between popup and map edge, px */
  var POPUP_MAX = 320;     /* 20rem */
  var POPUP_MIN = 240;     /* 15rem */
  var PIN_ROOM = 40;       /* space kept below the popup for the pin itself */

  var fitPopup = function(current){
    if (!map || popup !== current) return;
    if (map.isMoving()) { map.once('moveend', function(){ fitPopup(current); }); return; }
    var box = mapEl.getBoundingClientRect();
    var rect = current.getElement().getBoundingClientRect();
    var dx = 0, dy = 0;
    if (rect.left < box.left + POPUP_GAP) dx = rect.left - (box.left + POPUP_GAP);
    else if (rect.right > box.right - POPUP_GAP) dx = rect.right - (box.right - POPUP_GAP);
    if (rect.top < box.top + POPUP_GAP) dy = rect.top - (box.top + POPUP_GAP);
    else if (rect.bottom > box.bottom - POPUP_GAP) dy = rect.bottom - (box.bottom - POPUP_GAP);
    if (dx || dy) map.panBy([dx, dy], { duration: 300 });
  };

  var showPopup = function(lngLat, content, offset){
    if (popup) popup.remove();
    var width = mapEl.clientWidth - 2 * POPUP_GAP;
    var height = mapEl.clientHeight - 2 * POPUP_GAP - offset - PIN_ROOM;
    var current = new window.mapboxgl.Popup({
      offset: offset, anchor: 'bottom', className: 'store-locator_popup', focusAfterOpen: false,
      maxWidth: Math.max(160, Math.min(POPUP_MAX, width)) + 'px'
    }).setLngLat(lngLat).setDOMContent(content).addTo(map);
    var box = current.getElement().querySelector('.mapboxgl-popup-content');
    if (box) {
      box.style.minWidth = Math.max(160, Math.min(POPUP_MIN, width)) + 'px';
      box.style.maxHeight = Math.max(120, height) + 'px'; /* the card inherits it and scrolls inside */
    }
    popup = current;
    window.requestAnimationFrame(function(){ fitPopup(current); });
  };

  var openPopup = function(store){
    if (!map || !store) return;
    var card = makeCard(store);
    card.classList.remove('is-card'); /* list styling (border, hover) does not belong in the popup */
    showPopup(store.lngLat, card, 21);
  };

  var openFactory = function(){
    if (!map || !factoryCard || !FACTORY) return;
    var card = stripIds(factoryCard.cloneNode(true));
    card.removeAttribute('data-store-factory');
    showPopup(FACTORY, card, 24);
  };

  /* Every map-bound step works on its own instance, so callbacks of a removed map never touch a newer one */
  var addStoreLayer = function(instance){
    if (instance.getLayer('maerkte')) return Promise.resolve();
    return getJson('https://api.mapbox.com/v4/' + TILESET + '.json?secure&access_token=' + encodeURIComponent(TOKEN), 'TileJSON')
      .then(function(tilejson){
        if (map !== instance || instance.getLayer('maerkte')) return; /* map removed meanwhile, or layer already added */
        var layer = tilejson && Array.isArray(tilejson.vector_layers) && tilejson.vector_layers[0] && tilejson.vector_layers[0].id;
        if (!layer) throw fail('invalid', 'TileJSON ohne vector_layers');
        var before = instance.getLayer('werksverkauf') ? 'werksverkauf' : undefined; /* factory pin stays on top */
        instance.addSource('maerkte', { type: 'vector', url: 'mapbox://' + TILESET });
        instance.addLayer({
          id: 'maerkte', type: 'symbol', source: 'maerkte', 'source-layer': layer,
          layout: {
            'icon-image': 'burgis-pin',
            'icon-size': ['interpolate', ['linear'], ['zoom'], 4, 0.6, 10, 1],
            'icon-allow-overlap': ['step', ['zoom'], false, 9, true],
            'icon-padding': 1
          }
        }, before);
        /* A click on the Werksverkauf pin must not also open the store underneath */
        instance.on('click', 'maerkte', function(e){
          if (instance.getLayer('werksverkauf') && instance.queryRenderedFeatures(e.point, { layers: ['werksverkauf'] }).length) return;
          var store = e.features && e.features[0] ? toStore(e.features[0]) : null;
          if (store) openPopup(store);
        });
        pointer(instance, 'maerkte');
      });
  };

  /* The store layer is retried on the next search if TileJSON failed (the map itself keeps working) */
  var storeLayer = null; /* { instance, promise } — never reused for another map */
  var ensureStoreLayer = function(instance){
    if (storeLayer && storeLayer.instance === instance) return storeLayer.promise;
    var entry = { instance: instance };
    entry.promise = addStoreLayer(instance).then(function(){
      if (map === instance) mapRecovered();
    }, function(err){
      if (storeLayer === entry) storeLayer = null;
      if (map !== instance) return; /* error of a map that is gone */
      reportError(err, 'Tileset');
      mapError();
    });
    storeLayer = entry;
    return entry.promise;
  };

  var LOAD_TIMEOUT = 30000;  /* no 'load' at all, e.g. a hanging network */
  var ERROR_GRACE = 10000;   /* after an early error, wait this long for 'load' before giving up */

  /* Resolves with the map once its style has loaded; created at most once per attempt */
  var whenMap = function(){
    if (mapPromise) return mapPromise;
    var instance = null;
    mapPromise = loadLibrary().then(function(gl){
      return new Promise(function(resolve, reject){
        var settled = false, loadTimer = null, graceTimer = null;
        var giveUp = function(detail){
          if (settled) return;
          settled = true;
          clearTimeout(loadTimer); clearTimeout(graceTimer);
          reject(fail('map', detail));
        };
        var warned = Object.create(null); /* log each kind of map error once, not once per tile */
        gl.accessToken = TOKEN;
        try {
          instance = new gl.Map({ container: mapEl, style: STYLE, center: START.center, zoom: START.zoom, cooperativeGestures: true });
          instance.addControl(new gl.NavigationControl({ showCompass: false }), 'top-right');
        } catch (e) { giveUp('Karte konnte nicht erstellt werden'); return; }
        loadTimer = setTimeout(function(){ giveUp('Zeitüberschreitung beim Laden der Karte'); }, LOAD_TIMEOUT);

        instance.on('error', function(e){
          var status = e && e.error && e.error.status;
          var key = (e && e.sourceId ? e.sourceId : 'stil') + ':' + (status || '');
          if (!warned[key]) { warned[key] = true; warn('Kartenfehler' + (e && e.sourceId ? ' in ' + e.sourceId : '') + (status ? ' (HTTP ' + status + ')' : '')); }
          /* Tile/source errors are never fatal. Other early errors (style, sprite, glyphs) are only
             fatal if 'load' does not follow — a failed sprite still lets the map load. */
          if (!settled && !(e && e.sourceId) && !graceTimer) {
            graceTimer = setTimeout(function(){ giveUp('Kartenstil konnte nicht geladen werden'); }, ERROR_GRACE);
          }
        });

        instance.on('load', function(){
          if (settled) return;
          settled = true;
          clearTimeout(loadTimer); clearTimeout(graceTimer);
          map = instance;
          try {
            instance.resize();
            instance.addImage('burgis-pin', pinImage(), { pixelRatio: 2 });
            if (FACTORY) {
              instance.addSource('werksverkauf', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: FACTORY }, properties: {} } });
              instance.addLayer({ id: 'werksverkauf', type: 'symbol', source: 'werksverkauf', layout: { 'icon-image': 'burgis-pin', 'icon-size': 1.15, 'icon-allow-overlap': true } });
              instance.on('click', 'werksverkauf', openFactory);
              pointer(instance, 'werksverkauf');
            }
          } catch (e) { reject(fail('map', 'Kartenebenen konnten nicht angelegt werden')); return; }
          ensureStoreLayer(instance);
          resolve(instance);
        });
      });
    }).catch(function(err){
      reportError(err, 'Karte');
      mapError();
      /* Clean up this attempt completely; a later search may retry with a fresh map */
      if (instance) { try { instance.remove(); } catch (e) { /* already torn down */ } }
      if (map === instance) { map = null; popup = null; searchMarker = null; }
      if (storeLayer && storeLayer.instance === instance) storeLayer = null;
      mapPromise = null;
      throw err;
    });
    return mapPromise;
  };

  /* Map updates that arrive before the map is ready are kept and applied once it is */
  var pendingView = null;
  var applyView = function(view){
    pendingView = view;
    whenMap().then(function(){
      if (pendingView !== view) return; /* superseded by a newer search or reset */
      pendingView = null;
      view();
    }).catch(function(){});
  };

  /* Mapbox loads only when the locator approaches the viewport */
  var io = new IntersectionObserver(function(entries){
    if (entries.some(function(e){ return e.isIntersecting; })) { io.disconnect(); whenMap().catch(function(){}); }
  }, { rootMargin: '300px' });
  io.observe(root);

  /* ---------- Search: geocode PLZ / place, then nearest stores via Tilequery ---------- */

  var stores = [];
  var searchId = 0, searchController = null;

  var geocode = function(value, signal){
    return getJson('https://api.mapbox.com/search/geocode/v6/forward?q=' + encodeURIComponent(value) + '&country=de&language=de&limit=1&types=postcode,place,locality,district,address&access_token=' + encodeURIComponent(TOKEN), 'Geocoding', signal)
      .then(function(json){
        var hit = json && Array.isArray(json.features) ? json.features[0] : null;
        var center = hit && hit.geometry && Array.isArray(hit.geometry.coordinates) ? toLngLat(hit.geometry.coordinates[0], hit.geometry.coordinates[1]) : null;
        if (!center) throw fail('not-found');
        return center;
      });
  };

  var nearby = function(center, radius, signal){
    return getJson('https://api.mapbox.com/v4/' + TILESET + '/tilequery/' + center[0] + ',' + center[1] + '.json?radius=' + radius + '&limit=' + LIST_LIMIT + '&geometry=point&access_token=' + encodeURIComponent(TOKEN), 'Tilequery', signal)
      .then(function(json){
        if (!json || !Array.isArray(json.features)) throw fail('invalid', 'Tilequery: unerwartete Antwort');
        return json.features.map(toStore).filter(Boolean);
      });
  };

  var setSearched = function(active){
    if (submit) submit.hidden = active;
    if (listOpen) listOpen.hidden = !active;
    if (reset) reset.classList.toggle('is-visible', active);
  };
  setSearched(false);

  var km = function(m){ return (m / 1000).toLocaleString('de-DE') + ' km'; };
  var resultMessage = function(count, radius){
    if (!count) return MSG.none;
    if (count >= LIST_LIMIT) return 'Die ' + count + ' nächstgelegenen Märkte werden angezeigt.';
    var label = count + (count === 1 ? ' Markt' : ' Märkte');
    return radius === RADIUS_NEAR ? label + ' in Ihrer Nähe.'
      : 'Im Umkreis von ' + km(RADIUS_NEAR) + ' gibt es keine Märkte. ' + label + ' im Umkreis von ' + km(radius) + '.';
  };

  var selectStore = function(store){
    applyView(function(){ map.flyTo({ center: store.lngLat, zoom: 14 }); openPopup(store); });
  };

  var setActive = function(card, active){
    card.classList.toggle('is-active', active);
    var name = q('[data-store-name]', card);
    if (name) { if (active) name.setAttribute('aria-current', 'true'); else name.removeAttribute('aria-current'); }
  };

  var renderList = function(){
    if (!listEl) return;
    var fragment = document.createDocumentFragment();
    stores.forEach(function(store, index){
      var card = makeCard(store);
      /* The card itself is not a button (it contains the route link): the store name is the
         keyboard/screen-reader control, a click anywhere on the card does the same for the mouse */
      var name = q('[data-store-name]', card);
      if (name) {
        name.setAttribute('role', 'button');
        name.setAttribute('tabindex', '0');
        name.addEventListener('keydown', function(e){
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
        });
      }
      setActive(card, index === 0);
      card.addEventListener('click', function(e){
        if (e.target.closest('a')) return;
        forEach(listEl.children, function(el){ setActive(el, el === card); });
        closeModal();
        selectStore(store);
      });
      fragment.appendChild(card);
    });
    listEl.textContent = '';
    listEl.appendChild(fragment);
  };

  var cancelSearch = function(){
    searchId++;
    activeQuery = '';
    if (searchController) { searchController.abort(); searchController = null; }
  };

  var search = function(){
    var value = input ? input.value.trim() : '';
    if (!value) { cancelSearch(); resultText = MSG.empty; showStatus(); if (input) input.focus(); return; }
    if (value === activeQuery) return; /* same search still running */
    cancelSearch();
    resultText = '';
    var id = searchId;
    activeQuery = value;
    var controller = new AbortController();
    searchController = controller;
    var signal = controller.signal;
    var current = function(){ if (id !== searchId) throw fail('aborted'); };

    /* Start loading the map in parallel (search does not wait for it); retry the store layer if it failed */
    whenMap().then(ensureStoreLayer).catch(function(){});
    say(MSG.searching);

    geocode(value, signal)
      .then(function(center){
        current();
        return nearby(center, RADIUS_NEAR, signal).then(function(found){
          current();
          if (found.length) return { center: center, found: found, radius: RADIUS_NEAR };
          return nearby(center, RADIUS_FAR, signal).then(function(far){ return { center: center, found: far, radius: RADIUS_FAR }; });
        });
      })
      .then(function(result){
        current();
        stores = result.found;
        renderList();
        setSearched(true);
        resultText = resultMessage(stores.length, result.radius);
        showStatus();
        applyView(function(){
          if (popup) popup.remove();
          if (searchMarker) searchMarker.remove();
          searchMarker = new window.mapboxgl.Marker({ color: '#224385' }).setLngLat(result.center).addTo(map);
          var bounds = new window.mapboxgl.LngLatBounds(result.center, result.center);
          stores.slice(0, 8).forEach(function(s){ bounds.extend(s.lngLat); });
          map.fitBounds(bounds, { padding: 60, maxZoom: 13 });
        });
      })
      .catch(function(err){
        if (isAbort(err) || id !== searchId) return;
        if (err && err.kind === 'not-found') resultText = MSG.notFound;
        else { reportError(err, 'Suche'); resultText = MSG.searchError; }
        showStatus();
      })
      .then(function(){
        if (id === searchId) { activeQuery = ''; searchController = null; }
      });
  };

  var clearSearch = function(){
    cancelSearch();
    pendingView = null;
    if (input) { input.value = ''; input.focus(); }
    stores = [];
    if (listEl) listEl.textContent = '';
    setSearched(false);
    resultText = '';
    showStatus(); /* empty, or the map error if the map is still unavailable */
    if (searchMarker) { searchMarker.remove(); searchMarker = null; }
    if (popup) { popup.remove(); popup = null; }
    if (map) map.flyTo(START);
  };

  if (submit) submit.addEventListener('click', function(e){ e.preventDefault(); search(); });
  if (input) input.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); search(); } });
  if (reset) reset.addEventListener('click', function(e){ e.preventDefault(); clearSearch(); });

  /* ---------- List modal ---------- */

  var opener = null, previousOverflow = '';
  var FOCUSABLE = 'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])';
  var isOpen = function(){ return !!modal && modal.classList.contains('is-open'); };
  var setModalHidden = function(hidden){
    if (hidden) { modal.setAttribute('aria-hidden', 'true'); modal.setAttribute('inert', ''); }
    else { modal.removeAttribute('aria-hidden'); modal.removeAttribute('inert'); }
  };
  var openModal = function(e){
    if (!modal || isOpen()) return;
    opener = e && e.currentTarget ? e.currentTarget : document.activeElement;
    previousOverflow = document.documentElement.style.overflow;
    document.documentElement.style.overflow = 'hidden';
    modal.classList.add('is-open');
    setModalHidden(false);
    if (listOpen) listOpen.setAttribute('aria-expanded', 'true');
    var first = q('.is-active [data-store-name]', listEl) || q('[data-store-close]', modal);
    if (first) first.focus();
  };
  var closeModal = function(){
    if (!isOpen()) return;
    modal.classList.remove('is-open');
    setModalHidden(true);
    document.documentElement.style.overflow = previousOverflow;
    if (listOpen) listOpen.setAttribute('aria-expanded', 'false');
    var target = opener && opener.isConnected && !opener.hidden ? opener : input;
    opener = null;
    if (target) target.focus();
  };
  if (modal) {
    /* role="dialog", aria-modal, aria-labelledby and aria-haspopup are set in Webflow; only state is set here */
    setModalHidden(true);
    if (listOpen) {
      listOpen.setAttribute('aria-expanded', 'false');
      listOpen.addEventListener('click', openModal);
    }
    forEach(modal.querySelectorAll('[data-store-close]'), function(el){ el.addEventListener('click', closeModal); });
    document.addEventListener('keydown', function(e){
      if (!isOpen()) return;
      if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
      if (e.key !== 'Tab') return;
      var items = Array.prototype.filter.call(modal.querySelectorAll(FOCUSABLE), function(el){ return el.getClientRects().length > 0; });
      if (!items.length) { e.preventDefault(); return; }
      var first = items[0], last = items[items.length - 1];
      if (!modal.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  }
})();
</script>
