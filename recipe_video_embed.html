<script>
document.addEventListener("DOMContentLoaded", function () {
  /* Video cards: [data-video-url] takes a YouTube or Vimeo link (e.g. the CMS "Video" field),
     the provider is detected from the link. [data-youtube] / [data-vimeo] still accept an ID or a link.
     The player (youtube-nocookie / vimeo) is loaded only after the click.
     A card whose attributes are all empty (recipe without video) is hidden. */
  function decode(value) {
    let text = String(value || "").replace(/&amp;/g, "&");
    for (let i = 0; i < 2; i++) {
      try {
        const next = decodeURIComponent(text);
        if (next === text) break;
        text = next;
      } catch (error) {
        break;
      }
    }
    return text.trim();
  }
  function findYoutubeId(text) {
    const match = text.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#\s"']*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return match ? match[1] : "";
  }
  function findVimeoId(text) {
    const match = text.match(/vimeo\.com\/(?:.*?\/)?(?:video\/)?(\d{6,})/);
    return match ? match[1] : "";
  }
  /* An attribute may hold a plain ID (e.g. data-vimeo="1056575566") or any link */
  function getVideo(card) {
    const url = decode(card.getAttribute("data-video-url"));
    const youtube = decode(card.getAttribute("data-youtube"));
    const vimeo = decode(card.getAttribute("data-vimeo"));
    const youtubeId = findYoutubeId(url) || findYoutubeId(youtube) || findYoutubeId(vimeo) || (/^[A-Za-z0-9_-]{11}$/.test(youtube) ? youtube : "");
    if (youtubeId) return { provider: "youtube", id: youtubeId };
    const vimeoId = findVimeoId(url) || findVimeoId(vimeo) || (/^\d+$/.test(vimeo) ? vimeo : "");
    if (vimeoId) return { provider: "vimeo", id: vimeoId };
    return null;
  }
  function getVideoTitle(card, provider) {
    return card.getAttribute("data-video-title")?.trim() ||
      (provider === "youtube" ? "YouTube video" : "Vimeo video");
  }
  document.querySelectorAll("[data-video-url], [data-youtube], [data-vimeo]").forEach(card => {
    if (card.dataset.videoInit === "true") return;
    card.dataset.videoInit = "true";
    const video = getVideo(card);
    if (!video) {
      card.style.setProperty("display", "none", "important");
      return;
    }
    const provider = video.provider;
    const videoId = video.id;
    const videoTitle = getVideoTitle(card, provider);
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", `Video abspielen: ${videoTitle}`);
    function playVideo() {
      if (card.dataset.videoLoaded === "true") return;
      card.dataset.videoLoaded = "true";
      if (window.matchMedia("(max-width: 767px)").matches) {
        const videoBottom = card.querySelector("[data-video-bottom]");
        if (videoBottom) {
          videoBottom.style.setProperty("display", "none", "important");
        }
      }
      Array.from(card.children).forEach(child => {
        if (child.tagName !== "IFRAME") {
          child.hidden = true;
        }
      });
      const iframe = document.createElement("iframe");
      if (provider === "youtube") {
        iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&controls=1&rel=0&playsinline=1&iv_load_policy=3`;
        iframe.setAttribute(
          "allow",
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        );
      }
      if (provider === "vimeo") {
        iframe.src = `https://player.vimeo.com/video/${videoId}?autoplay=1&playsinline=1`;
        iframe.setAttribute("allow", "autoplay; fullscreen; picture-in-picture");
      }
      iframe.setAttribute("frameborder", "0");
      iframe.setAttribute("allowfullscreen", "");
      iframe.setAttribute("title", videoTitle);
      card.appendChild(iframe);
      card.removeAttribute("role");
      card.removeAttribute("tabindex");
      card.removeAttribute("aria-label");
    }
    card.addEventListener("click", playVideo);
    card.addEventListener("keydown", function (event) {
      if (event.target !== card) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        playVideo();
      }
    });
  });

  const target = document.querySelector("[data-radio-target]");
  if (!target) return;

  document.querySelectorAll(".filter_radio_item").forEach(item => {
    item.addEventListener("click", function () {
      const textEl = item.querySelector("[data-radio-text]");
      const text = textEl?.getAttribute("data-radio-text")?.trim() || " ";

      target.textContent = `\u00A0${text}\u00A0`;
    });
  });
});
</script>
