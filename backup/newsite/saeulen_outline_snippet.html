<style>
/* Profit-System: goldene Kontur läuft beim Aktivieren einer Karte einmal außen um die Karte (startet am Punkt unter dem Tab) */
.saeulen_slide{position:relative}
.saeulen_outline{position:absolute;pointer-events:none;z-index:3;overflow:visible}
.saeulen_outline .o-line{fill:none;stroke:#e1bf6e;stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(238,213,149,.9)) drop-shadow(0 0 12px rgba(225,191,110,.55))}
.saeulen_outline .o-spark{fill:none;stroke:#fff3cc;stroke-width:3;stroke-linecap:round;opacity:0;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px rgba(238,213,149,.95))}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var NS='http://www.w3.org/2000/svg',DURATION=2000,EASE='cubic-bezier(.45,0,.25,1)',SPARK=36;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mobile=matchMedia('(max-width: 991px)');
  document.querySelectorAll('[data-saeulen]').forEach(function(root){
    var el=root.querySelector('.saeulen_slider');
    if(!el||!el.swiper)return;
    var sw=el.swiper,seen=false;
    function cardOf(i){var s=sw.slides[i];return s&&(s.querySelector('[data-saeule-card],.saeulen_item,.saeulen_card')||s);}
    function clear(){root.querySelectorAll('.saeulen_outline').forEach(function(o){o.remove();});}
    function draw(animate){
      clear();
      var slide=sw.slides[sw.activeIndex],card=cardOf(sw.activeIndex);if(!slide||!card)return;
      var cr=card.getBoundingClientRect(),sr=slide.getBoundingClientRect();
      var tab=root.querySelector('.saeulen_tab.is-active'),useDot=tab&&!mobile.matches;
      /* Abstand zur Karte: so, dass die Linie oben durch den Punkt läuft (3–12 px), mobil 6 px */
      var g=6;
      if(useDot){var tr=tab.getBoundingClientRect(),rem=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;g=Math.min(12,Math.max(3,cr.top-(tr.bottom+3.375*rem)));}
      var w=cr.width+2*g,h=cr.height+2*g,s=1;
      var r=Math.max(0,Math.min((parseFloat(getComputedStyle(card).borderTopLeftRadius)||0)+g,w/2,h/2)-s);
      var x=useDot?tr.left+tr.width/2-cr.left+g:s+r;
      x=Math.min(Math.max(x,s+r),w-s-r);
      var d='M'+x+','+s+'H'+(s+r)+'A'+r+','+r+' 0 0 0 '+s+','+(s+r)+'V'+(h-s-r)+'A'+r+','+r+' 0 0 0 '+(s+r)+','+(h-s)+
        'H'+(w-s-r)+'A'+r+','+r+' 0 0 0 '+(w-s)+','+(h-s-r)+'V'+(s+r)+'A'+r+','+r+' 0 0 0 '+(w-s-r)+','+s+'H'+x;
      var svg=document.createElementNS(NS,'svg');svg.setAttribute('class','saeulen_outline');svg.setAttribute('aria-hidden','true');
      svg.setAttribute('width',w);svg.setAttribute('height',h);
      svg.style.left=(cr.left-sr.left-g)+'px';svg.style.top=(cr.top-sr.top-g)+'px';
      svg.innerHTML='<path class="o-line"/><path class="o-spark"/>';
      slide.appendChild(svg);
      var line=svg.firstChild,spark=svg.lastChild;line.setAttribute('d',d);spark.setAttribute('d',d);
      var len=line.getTotalLength();line.style.strokeDasharray=len;
      if(!animate||reduce||!line.animate){line.style.strokeDashoffset=0;return;}
      line.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:DURATION,easing:EASE,fill:'both'});
      /* Leuchtende Spitze läuft mit der Linie und blendet am Ende aus */
      spark.style.strokeDasharray=SPARK+' '+len;
      spark.animate([{strokeDashoffset:SPARK,opacity:1},{strokeDashoffset:SPARK-len,opacity:1,offset:.9},{strokeDashoffset:SPARK-len,opacity:0}],{duration:DURATION*1.1,easing:EASE,fill:'both'});
    }
    /* Während die Karte fährt: Kontur ausblenden; erst wenn sie steht, vom Punkt aus neu zeichnen */
    sw.on('slideChange',clear);
    sw.on('slideChangeTransitionEnd',function(){draw(true);});
    /* Erste Karte: Kontur erst zeichnen, wenn die Sektion sichtbar wird */
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(e,o){if(e[0].isIntersecting&&!seen){seen=true;draw(true);o.disconnect();}},{threshold:.35}).observe(cardOf(sw.activeIndex)||el);
    }else{seen=true;draw(false);}
    var tm;addEventListener('resize',function(){clearTimeout(tm);tm=setTimeout(function(){if(seen)draw(false);},150);});
  });
});
</script>
