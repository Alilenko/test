<style>
.team_list > .w-dyn-item { flex-shrink: 0; }
.team_list.is-static { justify-content: center; column-gap: 1.5rem; }
@media screen and (max-width: 479px) { .team_list.is-static { column-gap: 1rem; } }
.team_list.is-top .team_card { transition-duration: 0.7s; }
.team_badge { display: none; }
.team_list.is-top .is-current .team_card { transform: scale(1.164); }
.team_list.is-top .is-current .team_badge { display: flex; }
.team_list.is-top .is-current ~ .w-dyn-item .team_card { transform: translateX(8.2%); }
.team_list.is-top .w-dyn-item:has(~ .is-current) .team_card { transform: translateX(-8.2%); }
.team_badge_logo.w-dyn-bind-empty, .team_badge_logo:not([src]), .team_badge_logo[src=""] { display: none; }
@media (prefers-reduced-motion: reduce) { .team_card { transition: none; } }
</style>
<script>
(() => {
  const DELAY = 2800;
  const SPEED = 700;
  const MIN_SLIDER = 3;

  const setup = () => {
    document.querySelectorAll('[data-team]').forEach(sec => {
      const topList = sec.querySelector('.team_list.is-top');
      const botList = sec.querySelector('.team_list.is-bottom');
      if (!topList || !botList || sec.hasAttribute('data-team-ready')) return;
      sec.setAttribute('data-team-ready', '');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let sliders = [];
      let visible = true;

      sec.querySelectorAll('.team_badge').forEach(badge => {
        const title = badge.querySelector('.team_badge_title');
        if (!title || !title.textContent.trim()) badge.remove();
      });

      const items = list => [...list.children].filter(el => !el.hasAttribute('data-clone'));
      const markEl = (list, el) => {
        [...list.children].forEach(child => child.classList.remove('is-current'));
        if (el) el.classList.add('is-current');
      };
      const fill = (list, base) => {
        let guard = 0;
        while ((list.scrollWidth < list.parentElement.clientWidth * 3 || list.children.length < 8) && guard++ < 20) {
          base.forEach(n => {
            const c = n.cloneNode(true);
            c.setAttribute('data-clone', '');
            c.setAttribute('aria-hidden', 'true');
            c.classList.remove('is-current');
            list.appendChild(c);
          });
        }
      };

      const buildRow = (list, isTop) => {
        const base = items(list);
        const row = list.closest('.team_row');
        if (row) row.hidden = base.length === 0;
        if (!base.length) return;
        if (base.length < MIN_SLIDER || typeof Swiper === 'undefined') {
          list.classList.add('is-static');
          if (isTop) markEl(list, base[Math.floor((base.length - 1) / 2)]);
          return;
        }
        fill(list, base);
        const s = new Swiper(list.parentElement, {
          wrapperClass: 'team_list',
          slideClass: 'w-dyn-item',
          slidesPerView: 'auto',
          centeredSlides: true,
          loop: true,
          speed: reduce ? 0 : SPEED,
          grabCursor: true,
          autoplay: reduce ? false : { delay: DELAY, disableOnInteraction: false, pauseOnMouseEnter: true, reverseDirection: !isTop },
          breakpoints: { 0: { spaceBetween: 16 }, 768: { spaceBetween: 24 } },
          a11y: isTop
            ? { containerRoleDescriptionMessage: 'Karussell', itemRoleDescriptionMessage: 'Teammitglied', slideLabelMessage: '' }
            : { enabled: false },
          on: isTop ? { slideChange: sw => markEl(list, sw.slides[sw.activeIndex]) } : {}
        });
        s.slideToLoop(0, 0, false);
        if (isTop) {
          markEl(list, s.slides[s.activeIndex]);
        } else {
          const slide = s.slides[s.activeIndex];
          if (slide) list.style.marginLeft = `${-Math.round((slide.offsetWidth + s.params.spaceBetween) / 2)}px`;
        }
        sliders.push(s);
      };

      const build = () => {
        sliders.forEach(s => s.destroy(true, true));
        sliders = [];
        [topList, botList].forEach(list => {
          list.querySelectorAll('[data-clone]').forEach(c => c.remove());
          list.classList.remove('is-static');
          list.style.marginLeft = '';
          markEl(list, null);
        });
        buildRow(topList, true);
        buildRow(botList, false);
        if (!visible) sliders.forEach(s => { if (s.autoplay) s.autoplay.stop(); });
      };

      build();

      let lastWidth = innerWidth;
      let timer;
      addEventListener('resize', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          if (innerWidth === lastWidth) return;
          lastWidth = innerWidth;
          build();
        }, 250);
      });

      if (!reduce && 'IntersectionObserver' in window) {
        new IntersectionObserver(entries => {
          visible = entries[entries.length - 1].isIntersecting;
          sliders.forEach(s => {
            if (!s.autoplay) return;
            if (visible) s.autoplay.start();
            else s.autoplay.stop();
          });
        }).observe(sec);
      }
    });
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup);
  else setup();
})();
</script>
