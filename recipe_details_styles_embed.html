<style>
/* The script hides the rich text and empty units with [hidden]; the grid class would otherwise override it */
[data-recipe-details] [hidden]{display:none !important}
/* Zubereitung rich text (pill and text styles are nested styles in Webflow) */
.recipe-details_rich-text>p{margin-bottom:0}
.recipe-details_rich-text>h3:not(:first-child),.recipe-details_rich-text>h3:not(:first-child)+*{margin-top:3rem}
.recipe-details_rich-text>h3:not(:first-child)::before{content:"";position:absolute;top:-1.5rem;left:0;width:200vw;border-top:1px solid var(--_primitives---opacity--neutral-darkest-10)}
/* With the script the rich text is replaced by the list below (adds the circles and icons) */
.recipe-details_steps{display:flex;flex-direction:column;row-gap:1.5rem;margin:0;padding:0;list-style:none}
.recipe-details_step{display:flex;align-items:flex-start;column-gap:1.5rem}
.recipe-details_step+.recipe-details_step{padding-top:1.5rem;border-top:1px solid var(--_primitives---opacity--neutral-darkest-10)}
.recipe-details_step-label{flex:none;padding:.5rem;border-radius:.5rem;background-color:var(--_primitives---colors--background-lightest);color:var(--_primitives---colors--text-gray);font-size:1rem;font-weight:600;line-height:1.5;white-space:nowrap}
.recipe-details_step-content{display:flex;flex:1;min-width:0;flex-direction:column;padding-top:.5rem}
.recipe-details_step-meta{display:flex;margin-bottom:.75rem;align-items:flex-start;column-gap:.5rem;color:var(--_primitives---colors--text-gray);font-size:.875rem;line-height:1.5}
.recipe-details_step-meta svg{flex:none;width:1rem;height:1rem;margin-top:.125rem}
.recipe-details_step-text{margin:0;color:var(--_primitives---colors--text);font-size:1rem;line-height:1.5}
.recipe-details_step-content>ul,.recipe-details_step-content>ol{margin:0;padding-left:1.25rem;color:var(--_primitives---colors--text);font-size:1rem;line-height:1.5}
.recipe-details_step-check{display:flex;flex:none;width:1.5rem;height:1.5rem;margin-top:.5rem;padding:0;justify-content:center;align-items:center;border:1.5px solid var(--_primitives---opacity--neutral-darkest-10);border-radius:50%;background:transparent;color:var(--_primitives---colors--white);cursor:pointer;transition:background-color 200ms ease,border-color 200ms ease}
.recipe-details_step-check svg{width:.875rem;height:.875rem;opacity:0}
.recipe-details_step-check:hover{border-color:var(--_primitives---colors--text)}
.recipe-details_step-check:focus-visible{outline:2px solid var(--_primitives---colors--text);outline-offset:2px}
.recipe-details_step.is-done .recipe-details_step-check{border-color:var(--_primitives---colors--text);background-color:var(--_primitives---colors--text)}
.recipe-details_step.is-done .recipe-details_step-check svg{opacity:1}
.recipe-details_step.is-done .recipe-details_step-content,.recipe-details_step.is-done .recipe-details_step-label{opacity:.5}
@media screen and (max-width:479px){
.recipe-details_step{column-gap:1rem}
}
</style>
